name: CI

on:
  push:
    branches: [tanush, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static gates: no database required, fast, never flaky ──────────────────
  static:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint (includes the "no @/data/mock in routes" fixture guard)
        run: bun run lint
      - name: Build
        run: bun run build

  # ── Ledger integrity: the accounting invariants must hold ──────────────────
  ledger:
    name: migrate · seed · verify invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: monarch
          POSTGRES_DB: monarch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_ADMIN_URL: postgres://monarch:monarch@localhost:5432/monarch_ci
      DATABASE_URL: postgres://monarch_app:monarch_app@localhost:5432/monarch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The db:* scripts read connection strings from .env via --env-file.
      - name: Write .env
        run: |
          printf 'DATABASE_ADMIN_URL=%s\nDATABASE_URL=%s\n' \
            "$DATABASE_ADMIN_URL" "$DATABASE_URL" > .env
      - name: Migrate (creates the monarch_app role + RLS)
        run: bun run db:migrate
      - name: Give the app role a password so it can authenticate in CI
        run: psql "$DATABASE_ADMIN_URL" -c "ALTER ROLE monarch_app WITH LOGIN PASSWORD 'monarch_app';"
      - name: Seed demo books
        run: bun run db:seed
      - name: Verify ledger invariants (trial balance, control accounts, stock, tax)
        run: bun run db:verify
      - name: Ledger unit tests
        run: bun run db:test

  # ── End-to-end: every module renders + the marquee flows post ──────────────
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: [static, ledger]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: monarch
          POSTGRES_DB: monarch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_ADMIN_URL: postgres://monarch:monarch@localhost:5432/monarch_ci
      DATABASE_URL: postgres://monarch_app:monarch_app@localhost:5432/monarch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Write .env
        run: |
          printf 'DATABASE_ADMIN_URL=%s\nDATABASE_URL=%s\n' \
            "$DATABASE_ADMIN_URL" "$DATABASE_URL" > .env
      - run: bun run db:migrate
      - run: psql "$DATABASE_ADMIN_URL" -c "ALTER ROLE monarch_app WITH LOGIN PASSWORD 'monarch_app';"
      - run: bun run db:seed
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Warm the dev server, then run e2e
        # Start the dev server and compile the main routes up front, so the very
        # first login inside Playwright doesn't pay the cold Vite/server-fn
        # compile cost (which flakes auth.setup on a cold CI runner). Playwright's
        # webServer has reuseExistingServer, so it picks up this warm instance.
        run: |
          bun run dev -- --port 8082 --strictPort > /tmp/dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8082/login -o /dev/null && break; sleep 2; done
          curl -s http://localhost:8082/login -o /dev/null || true
          curl -s http://localhost:8082/ -o /dev/null || true
          sleep 10
          bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
