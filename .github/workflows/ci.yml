name: CI

on:
  push:
    branches: [tanush, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static gates: no database required, fast, never flaky ──────────────────
  static:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint (includes the "no @/data/mock in routes" fixture guard)
        run: bun run lint
      - name: Unit tests (exact-decimal arithmetic, …)
        run: bun test src/
      - name: Build
        run: bun run build

  # ── Ledger integrity: the accounting invariants must hold ──────────────────
  ledger:
    name: migrate · seed · verify invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: monarch
          POSTGRES_DB: monarch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_ADMIN_URL: postgres://monarch:monarch@localhost:5432/monarch_ci
      DATABASE_URL: postgres://monarch_app:monarch_app@localhost:5432/monarch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The db:* scripts read connection strings from .env via --env-file.
      - name: Write .env
        run: |
          printf 'DATABASE_ADMIN_URL=%s\nDATABASE_URL=%s\n' \
            "$DATABASE_ADMIN_URL" "$DATABASE_URL" > .env
      - name: Migrate (creates the monarch_app role + RLS)
        run: bun run db:migrate
      - name: Give the app role a password so it can authenticate in CI
        run: psql "$DATABASE_ADMIN_URL" -c "ALTER ROLE monarch_app WITH LOGIN PASSWORD 'monarch_app';"
      - name: Seed demo books
        run: bun run db:seed
      - name: Verify ledger invariants (trial balance, control accounts, stock, tax)
        run: bun run db:verify
      - name: Ledger unit tests
        run: bun run db:test
      - name: Idempotency integration test
        run: bun run db:test:idempotency
      - name: Bank reconciliation integration test
        run: bun run db:test:reconciliation
      - name: Maker-checker approvals integration test
        run: bun run db:test:approvals
      - name: Approval-queue (payments + journals) integration test
        run: bun run db:test:approval-queue
      - name: POS checkout atomicity integration test
        run: bun run db:test:pos
      - name: CSV master-data import integration test
        run: bun run db:test:import
      - name: GST place-of-supply split integration test
        run: bun run db:test:gst
      - name: GST reverse-charge & ITC-eligibility integration test
        run: bun run db:test:rcm
      - name: GSTR-1 rate-wise & HSN report integration test
        run: bun run db:test:gstr1
      - name: GSTR-1 JSON export integration test
        run: bun run db:test:gstr1-json

  # ── End-to-end: every module renders + the marquee flows post ──────────────
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: [static, ledger]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: monarch
          POSTGRES_PASSWORD: monarch
          POSTGRES_DB: monarch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_ADMIN_URL: postgres://monarch:monarch@localhost:5432/monarch_ci
      DATABASE_URL: postgres://monarch_app:monarch_app@localhost:5432/monarch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Write .env
        run: |
          printf 'DATABASE_ADMIN_URL=%s\nDATABASE_URL=%s\n' \
            "$DATABASE_ADMIN_URL" "$DATABASE_URL" > .env
      - run: bun run db:migrate
      - run: psql "$DATABASE_ADMIN_URL" -c "ALTER ROLE monarch_app WITH LOGIN PASSWORD 'monarch_app';"
      - run: bun run db:seed
      - name: Build the production server
        run: bun run build
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run e2e against the production build
        # Run against the PRECOMPILED Nitro server, not `vite dev`. The dev
        # server compiles routes/server-fns on first hit, which flakes auth.setup
        # on a cold CI runner; the built server has none of that. Playwright's
        # webServer has reuseExistingServer, so it reuses this instance on :8082.
        run: |
          PORT=8082 node .output/server/index.mjs > /tmp/srv.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8082/login -o /dev/null && break; sleep 2; done
          bunx playwright test
      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/srv.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
